[project]
name = "claude-prompt-eval-kit"
version = "0.1.0"
description = "YAML prompt evals for Claude: code checks + structured LLM judge + CI-friendly exit code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Sameer Hussain" }]
dependencies = ["anthropic>=2.8", "pydantic>=2", "pyyaml>=6"]

[project.scripts]
prompt-eval = "prompt_eval.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_eval"]

[tool.pytest.ini_options]
pythonpath = ["src"]
